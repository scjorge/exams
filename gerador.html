<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Banco de Questões</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        .card {
            width: 100%;
            overflow-wrap: break-word;
        }

        textarea,
        input,
        select {
            max-width: 100%;
        }

        html,
        body {
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding-bottom: 100px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
            margin-top: 15px;
            width: 100%;
        }

        .card {
            overflow-x: hidden;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-dark {
            background: #111827;
            color: white;
        }

        .option-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .option-row input:first-child {
            width: 80px;
        }

        .image-box {
            border: 2px dashed #aaa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
            margin-top: 10px;
            cursor: pointer;
        }

        .image-box:focus {
            outline: none;
            border-color: #2563eb;
        }

        .preview {
            margin-top: 15px;
            max-width: 220px;
            border-radius: 10px;
        }

        .badge {
            background: #111827;
            color: white;
            padding: 5px 10px;
            border-radius: 30px;
            display: inline-block;
            margin: 5px;
            font-size: 12px;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .counter {
            font-size: 20px;
            font-weight: bold;
            color: #16a34a;
        }

        .hidden {
            display: none;
        }

        .small {
            font-size: 12px;
            color: #666;
        }

        textarea {
            width: 100%;
            max-width: 100%;
        }

        #respostaHelper {
            width: 100%;
            margin-top: 15px;
            display: flex;
            flex-direction: column;

        }

        #respostaHelper label {
            display: flex;
            align-items: flex-start;
            /* Alinha o rádio/check no topo da primeira linha de texto */
            gap: 12px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background 0.2s;
        }

        #respostaHelper label:hover {
            background: #f3f4f6;
        }

        #respostaHelper input[type="radio"],
        #respostaHelper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            margin-top: 2px;
            /* Ajuste fino para alinhar com o texto */
            flex-shrink: 0;
            /* Impede o input de encolher */
        }

        #respostaHelper span {
            flex-grow: 1;
            font-size: 14px;
            line-height: 1.5;
            color: #374151;
            word-break: break-word;
            /* Garante que textos longos quebrem corretamente */
        }

        /* Para o modo Drag and Drop */
        .drag-helper-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .drag-helper-text {
            flex: 1;
            font-weight: bold;
        }

        .drag-helper-select {
            flex: 1;
            max-width: 300px;
        }

        .bottom-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Gerador de Banco de Questões</h1>

            <div class="grid">

                <div>
                    <label>Nome da Prova</label>
                    <input id="nomeProva" value="Minha Prova">
                </div>

            </div>

            <hr>

            <h2>Configurações Globais</h2>

            <div class="grid">

                <div>
                    <label>Nova Fonte</label>

                    <div class="option-row">
                        <input id="novaFonte">
                        <button class="btn-primary" onclick="addFonte()">+</button>
                    </div>

                    <div id="fontesLista"></div>
                </div>

                <div>
                    <label>Nova Categoria</label>

                    <div class="option-row">
                        <input id="novaCategoria">
                        <button class="btn-primary" onclick="addCategoria()">+</button>
                    </div>

                    <div id="categoriasLista"></div>
                </div>

                <div>
                    <label>Nova Subcategoria</label>

                    <div class="option-row">
                        <input id="novaSubcategoria">
                        <button class="btn-primary" onclick="addSubcategoria()">+</button>
                    </div>

                    <div id="subcategoriasLista"></div>
                </div>

            </div>

            <hr>

            <div class="top-actions">

                <div style="display:flex; gap:10px; align-items:center;">

                    <button class="btn-success" onclick="salvarQuestao()">
                        Salvar Questão
                    </button>

                    <button class="btn-primary" onclick="abrirEditorJSON()">
                        Ver / Editar JSON
                    </button>

                    <button class="btn-warn" onclick="baixarPacote()">
                        Baixar pacote
                    </button>

                    <button class="btn-danger" onclick="limparStorage()">
                        Limpar Dados
                    </button>
                </div>

                <div class="counter">
                    Questões Salvas:
                    <span id="contadorQuestoes">0</span>
                </div>


            </div>

        </div>

        <div class="card">

            <h2>Cadastro de Questão</h2>

            <div class="grid">

                <div>
                    <label>Tipo</label>
                    <select id="tipoQuestao"></select>
                </div>

                <div>
                    <label>Fonte</label>
                    <select id="fonteQuestao"></select>
                </div>

                <div>
                    <label>Categoria</label>
                    <select id="categoriaQuestao"></select>
                </div>

                <div>
                    <label>Subcategoria</label>
                    <select id="subcategoriaQuestao"></select>
                </div>

            </div>

            <div style="margin-top:15px;">
                <label>Pergunta</label>
                <textarea id="textoPergunta"></textarea>
            </div>

            <div style="margin-top:15px;"></div>
            <label>Nome da Imagem</label>
            <input id="nomeImagem">

            <div class="small">
                Clique abaixo e pressione CTRL + V
            </div>

            <div class="image-box" id="imageBox" tabindex="0">
                Colar imagem aqui
                <div id="preview"></div>
            </div>


            <hr style="margin-top:15px;">
            <div id="dragSection" class="hidden" style="margin-top:15px;">

                <h3>Pergunta Opções</h3>

                <div id="perguntaOpcoes"></div>

                <button class="btn-primary" onclick="addPerguntaOpcao()" style="margin-top:15px;">
                    + Adicionar Pergunta Opção
                </button>

            </div>

            <div id="normalSection" style="margin-top:15px;">

                <h3>Opções</h3>

                <div id="opcoes"></div>

                <button class="btn-primary" onclick="addOpcao()" style="margin-top:15px;">
                    + Adicionar Opção
                </button>

            </div>

            <hr style="margin-top:15px;">

            <div style="margin-top:15px;"></div>
            <label>
                Respostas
            </label>

            <input id="respostas"></input>

            <div id="respostaHelper"></div>



            <div class="bottom-actions" style="justify-content:flex-start;">

                <button class="btn-success" onclick="salvarQuestao()">
                    Salvar Questão
                </button>

                <button class="btn-primary" onclick="abrirEditorJSON()">
                    Ver / Editar JSON
                </button>

            </div>
        </div>

    </div>

    </div>

    </div>

    <script>

        let bancoQuestoes = [];
        let imagens = [];
        let imageCounter = 1;
        let currentImage = null;

        const fontes = [
            "examtopics",
            "examprepper",
            "skillcertpro",
        ];

        const tipos = [
            "single",
            "multiple",
            "drag_and_drop",
            "blank"
        ];

        const categorias = [];

        const subcategorias = [];

        function renderBadges(id, array) {

            const el = document.getElementById(id);

            el.innerHTML = "";

            array.forEach(item => {

                el.innerHTML += `
            <span class="badge">${item}</span>
        `;
            });
        }

        function refreshSelects() {

            fillSelect("fonteQuestao", fontes);

            fillSelect("tipoQuestao", tipos);

            fillSelect("categoriaQuestao", categorias);

            fillSelect("subcategoriaQuestao", subcategorias);

            renderBadges("fontesLista", fontes);
            renderBadges("categoriasLista", categorias);
            renderBadges("subcategoriasLista", subcategorias);
        }

        function fillSelect(id, array) {

            const el = document.getElementById(id);

            el.innerHTML = "";

            array.forEach(item => {

                const option = document.createElement("option");

                option.value = item;
                option.textContent = item;

                el.appendChild(option);
            });
        }

        function limparStorage() {

            if (!confirm("Apagar tudo?")) return;

            localStorage.removeItem("geradorQuestoes");

            location.reload();
        }

        function addFonte() {

            const val = document.getElementById("novaFonte").value.trim();

            if (!val) return;

            fontes.push(val);

            document.getElementById("novaFonte").value = "";

            refreshSelects();
        }

        function addCategoria() {

            const val = document.getElementById("novaCategoria").value.trim();

            if (!val) return;

            categorias.push(val);

            document.getElementById("novaCategoria").value = "";

            refreshSelects();
        }

        function addSubcategoria() {

            const val =
                document.getElementById("novaSubcategoria").value.trim();

            if (!val) return;

            subcategorias.push(val);

            document.getElementById("novaSubcategoria").value = "";

            refreshSelects();
        }

        function blankCleaner() {
            const opcoes = document.getElementById("opcoes");
            if (opcoes.children.length >= 1) {
                const primeiro = opcoes.firstElementChild;
                opcoes.innerHTML = "";
                opcoes.appendChild(primeiro);
            }
        }

        function addOpcao() {

            const letra = getNextLetter("#opcoes");

            const div = document.createElement("div");

            div.className = "option-row";

            div.innerHTML = `
                <input value="${letra}" placeholder="a"
                    oninput="updateRespostaUI()">

                <input placeholder="Texto da opção"
                    oninput="updateRespostaUI()">

                <button class="btn-danger"
                    onclick="this.parentElement.remove(); updateRespostaUI();">
                    X
                </button>
            `;

            const tipo = document.getElementById("tipoQuestao").value;
            if (tipo === "blank") {
                blankCleaner()
                return;
            }

            document.getElementById("opcoes").appendChild(div);
            updateRespostaUI();
        }
        // ================================
        // SUBSTITUA addPerguntaOpcao()
        // ================================

        function addPerguntaOpcao() {

            const letra =
                getNextLetter("#perguntaOpcoes");

            const div = document.createElement("div");

            div.className = "option-row";

            div.innerHTML = `
        <input
            value="${letra}"
            placeholder="a"
        >

        <input
            placeholder="Texto"
            oninput="updateRespostaUI()"
        >

        <button
            class="btn-danger"
            onclick="
                this.parentElement.remove();
                updateRespostaUI();
            ">
            X
        </button>
    `;

            document
                .getElementById("perguntaOpcoes")
                .appendChild(div);

            updateRespostaUI();
        }

        // ================================
        // SUBSTITUA EVENTO tipoQuestao
        // ================================

        document
            .getElementById("tipoQuestao")
            .addEventListener("change", () => {

                const tipo =
                    document.getElementById("tipoQuestao").value;

                if (tipo === "drag_and_drop") {

                    document
                        .getElementById("dragSection")
                        .classList.remove("hidden");

                } else {

                    document
                        .getElementById("dragSection")
                        .classList.add("hidden");
                }

                updateRespostaUI();
            });

        const imageBox =
            document.getElementById("imageBox");

        imageBox.addEventListener("click", () => {

            imageBox.focus();
        });

        imageBox.addEventListener("paste", (e) => {

            const items = e.clipboardData.items;

            for (const item of items) {

                if (item.type.includes("image")) {

                    const file = item.getAsFile();

                    const reader = new FileReader();

                    reader.onload = function (evt) {

                        const base64 = evt.target.result;

                        const nomeDefault = `imagem_${imageCounter}.png`;

                        document
                            .getElementById("nomeImagem")
                            .value = nomeDefault;

                        currentImage = {
                            name: nomeDefault,
                            base64
                        };

                        document
                            .getElementById("preview")
                            .innerHTML = `
                    <img
                        src="${base64}"
                        class="preview"
                    >
                `;
                    };

                    reader.readAsDataURL(file);
                }
            }
        });

        function salvarEstado() {
            const dados = {
                bancoQuestoes,
                imagens,
                imageCounter,
                nomeProva: document.getElementById("nomeProva").value,
                fontes,
                categorias,
                subcategorias
            };

            localStorage.setItem("geradorQuestoes", JSON.stringify(dados));
        }

        function carregarEstado() {
            const dados = localStorage.getItem("geradorQuestoes");
            if (!dados) return;

            const estado = JSON.parse(dados);

            bancoQuestoes =
                estado.bancoQuestoes || [];

            imagens =
                estado.imagens || [];

            imageCounter =
                estado.imageCounter || 1;

            document.getElementById("nomeProva").value = estado.nomeProva || "Minha Prova";

            // restaura arrays globais
            fontes.push(...(estado.fontes || []));
            categorias.push(...(estado.categorias || []));
            subcategorias.push(...(estado.subcategorias || []));

            refreshSelects();

            document.getElementById(
                "contadorQuestoes"
            ).innerText = bancoQuestoes.length;
        }

        function salvarQuestao() {
            const tipo = document.getElementById("tipoQuestao").value;
            const fonte = document.getElementById("fonteQuestao").value;
            const categoria = document.getElementById("categoriaQuestao").value;
            const subcategoria = document.getElementById("subcategoriaQuestao").value;
            const perguntaTexto = document.getElementById("textoPergunta").value.trim().replace(/\n/g, "<br>");
            const imagemNome = document.getElementById("nomeImagem").value.trim() || null;

            if (tipo === "blank") {
                blankCleaner()
            }

            const opcoes = [];

            document
                .querySelectorAll("#opcoes .option-row")
                .forEach(row => {

                    const key = row.children[0].value.trim();

                    const val = row.children[1].value.trim();

                    if (key && val) {

                        opcoes.push({
                            [key]: val
                        });
                    }
                });

            let perguntaOpcoes = [];

            if (tipo === "drag_and_drop") {

                document
                    .querySelectorAll(
                        "#perguntaOpcoes .option-row"
                    )
                    .forEach(row => {

                        const key =
                            row.children[0].value.trim();

                        const val =
                            row.children[1].value.trim();

                        if (key && val) {

                            perguntaOpcoes.push({
                                [key]: val
                            });
                        }
                    });
            }

            const respostasTexto = document.getElementById("respostas").value.trim();

            let respostas;

            if (tipo === "drag_and_drop") {
                try {
                    respostas = respostasTexto ? JSON.parse(respostasTexto) : {};
                } catch (e) {
                    alert("JSON inválido na resposta drag_and_drop");
                    return;
                }
            } else {

                respostas = respostasTexto
                    .split(",")
                    .map(x => x.trim())
                    .filter(Boolean);
            }

            const questao = {

                tipo,
                fonte,
                categoria,
                subcategoria,

                pergunta: {
                    texto: perguntaTexto.trim().replace(/\n/g, "<br>"),
                    imagem: imagemNome
                },

                opcoes,
                respostas
            };

            if (tipo === "drag_and_drop") {
                questao.pergunta_opcoes = perguntaOpcoes;
            }

            bancoQuestoes.push(questao);

            if (currentImage) {

                currentImage.name = imagemNome;
                if (imagemNome.startsWith("imagem_")) {
                    const number = imagemNome.split("_")[1].split(".")[0];
                    if (Number.isInteger(Number(number))) {
                        imageCounter = Math.max(imageCounter, parseInt(number));
                    }
                }

                imagens.push({ ...currentImage });

                imageCounter++;
            }

            limparFormulario();

            document.getElementById("contadorQuestoes").innerText = bancoQuestoes.length;

            salvarEstado();
            alert("Questão salva!");
        }

        function limparFormulario() {

            document
                .getElementById("textoPergunta")
                .value = "";

            document
                .getElementById("nomeImagem")
                .value = "";

            document
                .getElementById("respostas")
                .value = "";

            document
                .getElementById("opcoes")
                .innerHTML = "";

            document
                .getElementById("perguntaOpcoes")
                .innerHTML = "";

            document
                .getElementById("preview")
                .innerHTML = "";

            currentImage = null;
        }

        async function baixarPacote() {

            const prova = {
                nome: document.getElementById("nomeProva").value,
                questoes: bancoQuestoes
            };

            const zip = new JSZip();

            zip.file(
                "questions.json",
                JSON.stringify(prova, null, 4)
            );

            const pastaImagens =
                zip.folder("media");

            imagens.forEach(img => {

                const base64 =
                    img.base64.split(",")[1];

                pastaImagens.file(
                    img.name,
                    base64,
                    { base64: true }
                );
            });

            const blob =
                await zip.generateAsync({
                    type: "blob"
                });

            const a =
                document.createElement("a");

            a.href = URL.createObjectURL(blob);

            a.download = "banco_questoes.zip";

            a.click();
        }

        // ================================
        // ADICIONE ESTES MÉTODOS NOVOS
        // ================================

        function getNextLetter(containerSelector) {

            const rows =
                document.querySelectorAll(
                    `${containerSelector} .option-row`
                );

            const alphabet = "abcdefghijklmnopqrstuvwxyz";

            return alphabet[rows.length] || "";
        }

        function updateRespostaUI() {

            const tipo = document.getElementById("tipoQuestao").value;
            const respostas = document.getElementById("respostas");

            if (tipo === "single") {
                respostas.placeholder = "Selecione apenas UMA resposta";
                respostas.setAttribute("readonly", "readonly");
                renderRespostaSingle();
            } else if (tipo === "multiple") {
                respostas.placeholder = "Selecione uma ou mais respostas";
                respostas.setAttribute("readonly", "readonly");
                renderRespostaMultiple();
            } else if (tipo === "drag_and_drop") {
                respostas.placeholder = "Clique nos selects abaixo";
                respostas.setAttribute("readonly", "readonly");
                renderRespostaDragDrop();
            } else if (tipo === "blank") {
                respostas.placeholder = "Digite a resposta correta";
                respostas.removeAttribute("readonly");
                renderRespostaBlank();
            }
        }

        function renderRespostaBlank() {
            const respostas = document.getElementById("respostas");
            const helper = document.getElementById("respostaHelper");
            helper.innerHTML = "";

            const opcoes = document.querySelectorAll("#opcoes .option-row");

            if (opcoes.length > 0) {
                const row = opcoes[0];
                const texto = row.children[0].value;
                respostas.value = texto;
            }
        }

        function renderRespostaSingle() {

            const helper = document.getElementById("respostaHelper");
            helper.innerHTML = "";

            const opcoes = document.querySelectorAll("#opcoes .option-row");

            opcoes.forEach(row => {

                const letra =
                    row.children[0].value;

                const texto =
                    row.children[1].value;

                if (!letra || !texto) return;

                helper.innerHTML += `
                    <label>
                        <input
                            type="radio"
                            name="singleResposta"
                            value="${letra}"
                            onchange="syncSingleResposta()"
                        >
                        <span><b>${letra}</b> - ${texto}</span>
                    </label>
                    `;
            });
        }

        function syncSingleResposta() {

            const checked =
                document.querySelector(
                    'input[name="singleResposta"]:checked'
                );

            document.getElementById("respostas").value =
                checked ? checked.value : "";
        }

        function renderRespostaMultiple() {

            const helper =
                document.getElementById("respostaHelper");

            helper.innerHTML = "";

            const opcoes =
                document.querySelectorAll(
                    "#opcoes .option-row"
                );

            opcoes.forEach(row => {

                const letra =
                    row.children[0].value;

                const texto =
                    row.children[1].value;

                if (!letra || !texto) return;

                helper.innerHTML += `
            <label style="display:block;margin:10px 0;">
                <input
                    type="checkbox"
                    value="${letra}"
                    onchange="syncMultipleResposta()"
                >
                <b>${letra}</b> - ${texto}
            </label>
        `;
            });
        }

        function syncMultipleResposta() {

            const checked =
                document.querySelectorAll(
                    '#respostaHelper input[type="checkbox"]:checked'
                );

            const values =
                [...checked].map(x => x.value);

            document.getElementById("respostas").value =
                values.join(",");
        }

        function renderRespostaDragDrop() {

            const helper =
                document.getElementById("respostaHelper");

            helper.innerHTML = "";

            const perguntas =
                document.querySelectorAll(
                    "#perguntaOpcoes .option-row"
                );

            const respostas =
                document.querySelectorAll(
                    "#opcoes .option-row"
                );

            perguntas.forEach(pergunta => {

                const key =
                    pergunta.children[0].value;

                const texto =
                    pergunta.children[1].value;

                if (!key || !texto) return;

                let options = "";

                respostas.forEach(resp => {

                    const letra =
                        resp.children[0].value;

                    const txt =
                        resp.children[1].value;

                    if (!letra || !txt) return;

                    options += `
                <option value="${letra}">
                    ${letra} - ${txt}
                </option>
            `;
                });

                helper.innerHTML += `
            <div style="
                display:flex;
                gap:10px;
                margin-bottom:10px;
                align-items:center;
            ">

                <div style="min-width:250px;">
                    <b>${key}</b> - ${texto}
                </div>

                <select
                    onchange="syncDragResposta()"
                    data-key="${key}"
                >
                    <option value="">
                        Selecione
                    </option>

                    ${options}
                </select>

            </div>
        `;
            });
        }

        function syncDragResposta() {

            const selects =
                document.querySelectorAll(
                    "#respostaHelper select"
                );

            const result = {};

            selects.forEach(select => {

                const key =
                    select.dataset.key;

                const value =
                    select.value;

                if (value) {

                    result[key] = value;
                }
            });

            document.getElementById("respostas").value =
                JSON.stringify(result);
        }

        function abrirEditorJSON() {

            const modal =
                document.getElementById("jsonModal");

            const jsonData = {
                nome: document.getElementById("nomeProva").value,
                questoes: bancoQuestoes
            };

            document
                .getElementById("jsonEditor")
                .value = JSON.stringify(jsonData, null, 4);

            modal.style.display = "flex";
        }

        function fecharEditorJSON() {

            document.getElementById("jsonModal")
                .style.display = "none";
        }

        function salvarEdicaoJSON() {

            try {

                const json =
                    JSON.parse(
                        document
                            .getElementById("jsonEditor")
                            .value
                    );

                bancoQuestoes = json.questoes || [];

                document
                    .getElementById("nomeProva")
                    .value = json.nome || "";

                alert("JSON atualizado!");

                fecharEditorJSON();

                document
                    .getElementById("contadorQuestoes")
                    .innerText = bancoQuestoes.length;

                salvarEstado();
            } catch (e) {
                alert("JSON inválido");
            }
        }

        function bindAutoUpdate() {

            document.querySelectorAll("input, select, textarea")
                .forEach(el => {

                    el.addEventListener("input", () => {
                        updateRespostaUI();
                    });

                    el.addEventListener("change", () => {
                        updateRespostaUI();
                    });
                });
        }

        carregarEstado();
        refreshSelects();
        addOpcao();
        updateRespostaUI();
        bindAutoUpdate();
    </script>

    <div id="jsonModal" style="
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.7);
        display:none;
        align-items:center;
        justify-content:center;
        z-index:9999;
    ">

        <div style="
            width:90%;
            height:90%;
            background:white;
            border-radius:12px;
            padding:20px;
            display:flex;
            flex-direction:column;
        ">

            <h2>
                Editor JSON
            </h2>

            <textarea id="jsonEditor" style="
                flex:1;
                width:100%;
                font-family:monospace;
                font-size:14px;
            "></textarea>

            <div style="
                margin-top:15px;
                display:flex;
                gap:10px;
            ">

                <button class="btn-success" onclick="salvarEdicaoJSON()">
                    Salvar JSON
                </button>

                <button class="btn-danger" onclick="fecharEditorJSON()">
                    Fechar
                </button>

            </div>

        </div>

    </div>
</body>

</html>
