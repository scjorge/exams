<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Prova</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />

</head>

<body>

  <div class="container py-4">

    <h1 class="mb-4" id="provaTitulo">
      Prova
    </h1>

    <div class="row g-3 mb-4">

      <div class="col-md-3">
        <label class="form-label">Prova</label>

        <select id="provaSelect" class="form-select"></select>
      </div>

      <div class="col-md-2">
        <label class="form-label">Tipo</label>

        <select id="filtroTipo" class="form-select"></select>
      </div>

      <div class="col-md-2">
        <label class="form-label">Categoria</label>

        <select id="filtroCategoria" class="form-select"></select>
      </div>

      <div class="col-md-2">
        <label class="form-label"> Subcategoria</label>

        <select id="filtroSubcategoria" class="form-select"></select>
      </div>

      <div class="col-md-2">
        <label class="form-label">Fonte</label>

        <select id="filtroFonte" class="form-select"></select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Buscar</label>

        <input id="buscaKeyword" class="form-control" placeholder="Buscar">
      </div>

    </div>

    <div class="row g-2 mb-4">

      <div class="col-md-2">
        <button id="btnRandom" class="btn btn-warning w-100">
          Randomizar
        </button>
      </div>

      <div class="col-md-2">
        <button id="btnReset" class="btn btn-danger w-100">
          Resetar
        </button>
      </div>

      <div class="col-md-3">
        <button id="btnMapa" class="btn btn-info w-100" data-bs-toggle="modal" data-bs-target="#modalMapa">
          Respostas Iguais
        </button>
      </div>

      <div class="col-md-3">
        <button id="btnTermosRespostas" class="btn btn-info w-100" data-bs-toggle="modal" data-bs-target="#modalTermoRespostas">
          Termos nas Respostas
        </button>
      </div>

      <div class="col-md-3 d-flex align-items-center">

        <div class="form-check">

          <input class="form-check-input" type="checkbox" id="somenteErradas">

          <label class="form-check-label">
            Somente Erradas
          </label>

        </div>
        <div class="form-check ms-3">

          <input class="form-check-input" type="checkbox" id="somenteRevisao">

          <label class="form-check-label">
            Somente Revisão
          </label>

        </div>
      </div>

    </div>

    <div class="mb-4">

      <strong>Total:</strong>
      <span id="statusTotal">0</span>

      |

      <strong>Corretas:</strong>
      <span id="statusCorretas">0</span>

      |

      <strong>Erradas:</strong>
      <span id="statusErradas">0</span>

      |

      <strong>Revisão:</strong>
      <span id="statusRevisao">0</span>

    </div>

    <div id="questoes"></div>

    <div id="paginacao" class="pagination-wrap"></div>

  </div>

  <!-- MODAL -->

  <div class="modal fade" id="modalMapa" tabindex="-1">

    <div class="modal-dialog modal-lg">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Mapa Respostas
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>

        <div class="modal-body" id="modalMapaBody"></div>

      </div>

    </div>

  </div>


  <!-- MODAL -->

  <div class="modal fade" id="modalTermoRespostas" tabindex="-1">

    <div class="modal-dialog modal-lg">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Mapa Respostas
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>

        <div class="modal-body" id="modalTermoRespostasBody"></div>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="./js/app.js"></script>

</body>

</html>
